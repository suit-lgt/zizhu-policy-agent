<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>资助政策智能体 · 学生端</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>资助政策智能体 · 学生端</h1>
      <div class="sub">勾选你的学籍与家庭情况，得到可申请项目、依据条款与材料清单</div>
    </div>
    <div class="badge" id="me-badge">未登录 · <a href="login.html">请先登录或注册</a></div>
  </header>

  <nav>
    <a class="on" href="index.html">学生端</a>
  </nav>

  <div class="disclaimer">
    AI 初判仅供参考，最终以资助部门认定为准。系统只出“可申请／需核实／暂不适用”，不作符合性认定，也不代替政务系统。
  </div>

  <div class="panel">
    <form id="form">
      <div id="groups"></div>
      <label class="consent">
        <input type="checkbox" id="consent">
        <span>我已阅读：系统只采集判定所需的学籍与家庭情况字段，用于当次初判；不保存姓名，不用于其他用途，可随时撤回并删除本次任务。</span>
      </label>
      <div class="actions">
        <button type="submit" class="primary" id="submit">生成初判</button>
        <button type="button" class="ghost" id="reset">清空</button>
        <button type="button" class="ghost" id="demo">载入示例</button>
        <span class="hint">可只填一部分，未填项会标为“需核实”，不会替你猜。</span>
      </div>
    </form>
  </div>

  <div class="panel">
    <div class="group-title">政策问答（答案只引用条款，检索不到就拒答）</div>
    <div class="actions">
      <input type="text" id="q" placeholder="例如：国家助学金的申请条件、励志奖学金多少元" style="flex:1;min-width:240px">
      <button class="primary" id="ask">提问</button>
    </div>
    <div id="qa" class="sec"></div>
  </div>

  <section class="results" id="results"></section>
</div>

<div id="mask" class="modal-mask">
  <div class="modal">
    <h3 id="m-title">条款原文</h3>
    <div class="doc" id="m-doc"></div>
    <div class="quote" id="m-quote"></div>
    <div class="flag" id="m-flag"></div>
    <div class="foot">
      <a id="m-link" class="ghost" href="#" target="_blank" rel="noopener">打开官方页面</a>
      <button class="ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const GROUPS = [
  { title: "学籍情况", codes: ["stage", "enrollment", "normal_program", "grade"] },
  { title: "家庭经济情况", codes: ["income_difficulty", "income_band", "special_hardship"] },
  { title: "特殊身份", codes: ["veteran", "orphan", "martyr_child", "disabled"] },
  { title: "其他情况", codes: ["hukou_province", "other_provincial_aid", "school_tier"] },
  { title: "评审类（只作参考，不参与判等）", codes: ["academic"] }
];
const H = { "Content-Type": "application/json" };
let FIELDS = {}, MATS = {}, STATE = {};

function fmt(s) {
  if (!s) return "";
  const d = new Date(s);
  return d.toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false }).replace(/\//g, "-");
}

function ctrl(f) {
  const id = "f_" + f.code;
  let html = `<label for="${id}">${f.name}</label>`;
  if (f.type === "bool") {
    html += `<select id="${id}" data-code="${f.code}"><option value="">未填</option><option value="true">是</option><option value="false">否</option></select>`;
  } else if (f.type === "enum") {
    const opts = (f.values || []).map(v => `<option value="${v}">${v}</option>`).join("");
    html += `<select id="${id}" data-code="${f.code}"><option value="">未填</option>${opts}</select>`;
  } else {
    html += `<input id="${id}" data-code="${f.code}" type="number" min="1" max="8" placeholder="未填">`;
  }
  return `<div>${html}<div class="hint" style="margin-top:4px">${f.description || ""}</div></div>`;
}

async function boot() {
  const res = await fetch("api/fields", { headers: H });
  const payload = await res.json();
  FIELDS = Object.fromEntries(payload.fields.map(f => [f.code, f]));
  document.getElementById("groups").innerHTML = GROUPS.map(g => {
    const fields = g.codes.filter(c => FIELDS[c]).map(c => ctrl(FIELDS[c])).join("");
    return `<div class="group-title">${g.title}</div><div class="grid">${fields}</div>`;
  }).join("");
  const m = await (await fetch("api/materials", { headers: H })).json();
  m.items.forEach(x => { MATS[x.project_id] = MATS[x.project_id] || {}; MATS[x.project_id][x.name] = x.source_type; });
}

function collect() {
  const out = {};
  document.querySelectorAll("[data-code]").forEach(el => {
    const v = el.value.trim();
    if (v === "") return;
    const code = el.dataset.code;
    if (FIELDS[code] && FIELDS[code].type === "int") out[code] = Number(v);
    else if (FIELDS[code] && FIELDS[code].type === "bool") out[code] = (v === "true");
    else out[code] = v;
  });
  return out;
}

function fill(sample) {
  document.querySelectorAll("[data-code]").forEach(el => {
    const code = el.dataset.code;
    if (!(code in sample)) { el.value = ""; return; }
    const v = sample[code];
    el.value = (v === true ? "true" : v === false ? "false" : String(v));
  });
}

async function loadSample(name) {
  const all = await (await fetch("api/samples", { headers: H })).json();
  if (!all[name]) return false;
  fill(all[name]);
  return true;
}

function tierClass(c) { return c || "not_applicable"; }

function card(item) {
  if (!item.conclusion) {
    return `<div class="card"><div class="proj">${item.project_name}</div>
      <div class="meta">${item.note || "当前版本未匹配"}</div></div>`;
  }
  const refs = (item.reasons || []).map(r => `
    <button class="ref" onclick="openClause(${r.clause_id})">
      <cite>${r.doc_no} ${r.article_no} · 正文 ${r.char_start}–${r.char_end}</cite>${r.quote}</button>`).join("");
  const mats = (item.materials || []).map(m => {
    const src = (MATS[item.project_id] || {})[m] || "学校要求";
    return `<li>${m}<span class="small">（来源：${src}）</span></li>`;
  }).join("");
  const notes = (item.notes || []).length ? `<div class="notes">${item.notes.join("；")}</div>` : "";
  return `<div class="card ${tierClass(item.conclusion)}">
    <div class="card-top"><div class="proj">${item.project_name}</div>
      <span class="tier ${tierClass(item.conclusion)}">${item.conclusion_label}</span></div>
    <div class="meta">
      ${item.missing_fields && item.missing_fields.length ? "缺项：" + item.missing_fields.join("、") + "　" : ""}
      ${item.review_required ? "需学校评审　" : ""}${item.standard_note ? "标准：" + item.standard_note : ""}</div>
    ${refs ? `<div class="sec"><div class="sec-label">依据条款（点击查看原文）</div>${refs}</div>` : ""}
    ${mats ? `<div class="sec"><div class="sec-label">材料清单</div><ul class="mats">${mats}</ul>
      <div class="meta">办理渠道：${item.channel || "—"}</div></div>` : ""}
    ${notes}</div>`;
}

const STEPS = [["triaged", "已初判"], ["reviewing", "复核中"], ["approved", "已通过"], ["returned", "已退回"], ["appealed", "申诉中"], ["amended", "已改判"]];

function statusBar(data) {
  const st = data.status || "triaged";
  const steps = STEPS.map(([k, label]) => `<span class="step ${k === st ? "on" : ""}">${label}</span>`).join("");
  const canSubmit = st === "triaged";
  const canAppeal = ["approved", "returned", "amended"].includes(st);
  return `<div class="panel" style="margin-top:18px">
    <div class="group-title">办理进度</div>
    <div class="steps">${steps}</div>
    <div class="actions" style="margin-top:10px">
      ${canSubmit ? `<button class="primary" onclick="submitReview()">提交复核</button>` : ""}
      ${canAppeal ? `<input type="text" id="appeal-reason" placeholder="申诉理由（必填）" style="flex:1;min-width:220px">
        <button class="ghost" onclick="sendAppeal()">提交申诉</button>` : ""}
      <button class="ghost" onclick="exportMd()">导出材料包</button>
      <button class="ghost" onclick="requestExport()">申请导出审批</button>
      <span class="hint" id="st-msg"></span>
    </div>
    <div class="small" style="margin-top:8px">${(data.events || []).map(e => `${fmt(e.created_at)} ${e.action}${e.reason ? "：" + e.reason : ""}`).join("　|　")}</div>
  </div>`;
}

function tracePanel(data) {
  const ag = data.agents || {};
  const tr = data.trace || [];
  if (!tr.length) return "";
  return `<div class="disclaimer" style="margin-bottom:12px">
    <b>多智能体协同过程</b>（${ag.count || tr.length}/${ag.planned || tr.length} 个代理完成；
    模式：${ag.mode === "rules" ? "确定性规则，不调用模型" : ag.mode}）<br>
    ${tr.map(s => `<span class="small">${s.seq}. <b>${s.label}</b>（${s.agent}）· ${s.status} · ${s.ms}ms：
      ${s.summary}</span>`).join("<br>")}
    <div class="small">${ag.note || ""}</div>
  </div>`;
}

function render(data) {
  STATE = data;
  const items = (data.items || []).filter(i => i.conclusion || i.note);
  const fallback = data.fallback ? `<div class="disclaimer">${data.fallback}</div>` : "";
  document.getElementById("results").innerHTML = `
    <div class="result-head"><div><strong>初判结果</strong>
      <span class="hint">　任务 ${data.task_id} · 政策版本 ${data.policy_version}</span></div></div>
    <div class="meta">命中 ${data.hit_count} 项（可申请 ${(data.items || []).filter(i => i.conclusion === "eligible").length}，需核实 ${(data.items || []).filter(i => i.conclusion === "need_check").length}）</div>
    ${tracePanel(data)}
    ${items.map(card).join("")}
    ${fallback}
    ${statusBar(data)}`;
}

async function submit(e) {
  e.preventDefault();
  if (!document.getElementById("consent").checked) {
    alert("请先勾选隐私授权");
    return;
  }
  const btn = document.getElementById("submit");
  btn.disabled = true; btn.textContent = "判等中…";
  try {
    const body = collect(); body.consent = true;
    const res = await fetch("api/triage", { method: "POST", headers: H, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) {
      const msg = typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail || data);
      render({ items: [], task_id: "—", policy_version: "—", hit_count: 0, fallback: "输入有误：" + msg });
      return;
    }
    render(data);
  } finally {
    btn.disabled = false; btn.textContent = "生成初判";
  }
}

async function refresh() {
  if (!STATE.task_id || STATE.task_id === "—") return;
  const res = await fetch("api/triage/" + STATE.task_id, { headers: H });
  if (res.ok) render(await res.json());
}

async function submitReview() {
  if (!confirm("确认把本次初判提交人工复核？提交后进入教师审核队列。")) return;
  const res = await fetch(`api/triage/${STATE.task_id}/submit`, { method: "POST", headers: H });
  const data = await res.json();
  if (!res.ok) { document.getElementById("st-msg").textContent = data.detail; return; }
  await refresh();
}

async function sendAppeal() {
  const reason = document.getElementById("appeal-reason").value.trim();
  if (!reason) { document.getElementById("st-msg").textContent = "申诉须填写理由"; return; }
  if (!confirm("确认提交申诉？提交后会进入人工裁决并留下记录。")) return;
  const res = await fetch(`api/triage/${STATE.task_id}/appeal`, { method: "POST", headers: H,
    body: JSON.stringify({ reason }) });
  const data = await res.json();
  if (!res.ok) { document.getElementById("st-msg").textContent = data.detail; return; }
  await refresh();
}

function exportMd() { if (STATE.task_id) window.location.href = "api/export/" + STATE.task_id; }

async function requestExport() {
  if (!STATE.task_id) return;
  const res = await fetch("api/export-requests", { method: "POST", headers: H, body: JSON.stringify({ task_id: STATE.task_id }) });
  const data = await res.json();
  document.getElementById("st-msg").textContent = res.ok
    ? `已提交导出审批（申请号 ${data.request_id}），待管理员审批后可导出`
    : (data.detail || "提交失败");
}

async function ask() {
  const q = document.getElementById("q").value.trim();
  if (q.length < 2) return;
  const res = await fetch("api/qa", { method: "POST", headers: H, body: JSON.stringify({ question: q }) });
  const data = await res.json();
  const hits = (data.hits || []).map(h => `
    <button class="ref" onclick="openClause(${h.clause_id})">
      <cite>${h.doc_no} ${h.article_no}</cite>${h.quote.slice(0, 120)}…</button>`).join("");
  document.getElementById("qa").innerHTML = `
    <div class="notes" style="background:${data.refused ? "#fff8ec" : "#f2faf8"};color:#24504a">
      ${data.answer.replace(/\n/g, "<br>")}</div>
    <div class="small" style="margin-top:6px">回答模式：${data.mode_label || "离线规则模式"} · 提示词版本 ${data.prompt_version || "qa_v1"}${data.fallback ? "（在线失败已回退）" : ""}</div>
    ${hits ? `<div class="sec-label" style="margin-top:10px">命中条款</div>${hits}` : ""}
    <div class="small">${data.disclaimer || ""}</div>`;
}

function openClause(id) {
  fetch("api/clause/" + id, { headers: H }).then(r => r.json()).then(c => {
    document.getElementById("m-title").textContent = c.policy_title;
    document.getElementById("m-doc").textContent = `${c.doc_no} ${c.article_no} · 正文 ${c.char_start}–${c.char_end} · 台账状态 ${c.status}`;
    document.getElementById("m-quote").textContent = c.text;
    document.getElementById("m-flag").textContent = c.status === "pending_verify" ? "该文件文号与生效日期尚未人工核对，仅供内部验证" : "";
    document.getElementById("m-link").href = c.url || "#";
    document.getElementById("mask").style.display = "flex";
  });
}
function closeModal() { document.getElementById("mask").style.display = "none"; }

document.getElementById("form").addEventListener("submit", submit);
document.getElementById("ask").addEventListener("click", ask);
document.getElementById("reset").addEventListener("click", () => {
  document.querySelectorAll("[data-code]").forEach(el => { el.value = ""; });
  document.getElementById("results").innerHTML = "";
  document.getElementById("consent").checked = false;
});
document.getElementById("demo").addEventListener("click", async () => {
  await loadSample("complete");
  document.getElementById("consent").checked = true;
  document.getElementById("form").requestSubmit();
});

boot().then(async () => {
  const q = new URLSearchParams(location.search).get("case");
  if (q && await loadSample(q)) {
    document.getElementById("consent").checked = true;
    document.getElementById("form").requestSubmit();
  }
});
</script>
<script>
(async function () {
  try {
    const me = await (await fetch("api/auth/me")).json();
    if (!me.logged_in || me.role !== "student") {
      location.href = "login.html";
      return;
    }
    const b = document.getElementById("me-badge");
    if (!b) return;
    b.innerHTML = `已登录：${me.nickname}（${me.role}）` +
      (me.must_change ? ` · <b style="color:#b45309">临时密码，请尽快改密</b>` : "") +
      ` · <a href="#" onclick="fetch('api/auth/logout',{method:'POST'}).then(()=>location.reload());return false">退出</a>`;
  } catch (e) { /* 未登录保持演示态 */ }
})();
</script>
</body>
</html>
