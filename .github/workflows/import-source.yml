name: Import source archive

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract source
        run: |
          curl -fsSL https://zhigang.suit-achieve.cn/zizhu-src.tar.gz -o /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz -C .
          rm -rf bootstrap
      - name: Commit imported source
        run: |
          git config user.name "suit-lgt"
          git config user.email "suit-lgt@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "v0.6.0: 导入完整源码（含前后端）"; git push; fi
